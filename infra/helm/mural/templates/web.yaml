apiVersion: apps/v1
kind: Deployment
metadata:
  name: mural-web
  labels:
    {{- include "mural.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: mural-web
  template:
    metadata:
      labels:
        app: mural-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: mural-config
                  key: API_UPSTREAM
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mural-web
  labels:
    {{- include "mural.labels" . | nindent 4 }}
spec:
  selector:
    app: mural-web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
